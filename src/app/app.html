
<app-navbar
  (ingredienteSeleccionado)="filtrarPorIngrediente($event)">
</app-navbar>

<main>
  <section id="pizzas" class="container py-4">
    <h1 class="text-center mb-4">4V Pizza</h1>

    <app-pizza
      [ingrediente]="ingredienteSeleccionado">
    </app-pizza>
  </section>

  <section id="pedido" class="container py-4">
    <h2 class="text-center mb-4">Haz tu pedido</h2>

    <app-formulario></app-formulario>
  </section>
</main>

<footer class="bg-dark text-white text-center p-3">
  <p class="mb-0">© 2026 4V Pizza</p>
</footer>
