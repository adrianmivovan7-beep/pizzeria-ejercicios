
<app-navbar
  (ingredienteSeleccionado)="filtrarPorIngrediente($event)">
</app-navbar>

<main>
  <header class="bg-dark text-white text-center py-5">
    <h1 class="display-4">Bienvenido a 4V Pizza</h1>
    <p class="lead">Disfruta de nuestras deliciosas pizzas artesanales</p>
  </header>

  <section id="pizzas" class="container py-4">
    <app-pizza
      [filtro]="filtroActual">
    </app-pizza>
  </section>

  <section id="pedido" class="container py-4">
    <app-formulario></app-formulario>
  </section>
</main>

<footer class="bg-dark text-white text-center p-3">
  <p class="mb-0">© 2026 4V Pizza</p>
</footer>
