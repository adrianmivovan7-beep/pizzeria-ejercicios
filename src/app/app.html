<section id="main">
  <section id="pizzas">
    <header>
      <div class="title p-4">
        <h1>Pizzeria4V</h1>
      </div>
    </header>

    <app-pizza></app-pizza>
  </section>


  <section class="p-3" id="pedido">
    <div class="title p-4">
      <h2>Haz tu pedido</h2>
    </div>
    <div class="container border color-black p-4">
      <form>
        <div class="mb-3">
          <div>
            <label for="hora" class="form-label">Hora: </label>
            <input id="hora" name="hora" type="time" required>
          </div>
        </div>
        <div class="mb-3">
          <div>
            <label for="direccion" class="form-label">Dirección de entrega: </label>
            <input id="direccion" name="direccion" type="text" required>
          </div>
        </div>
        <div class="mb-3">
          <label for="pizza">Pizza: </label>
          <select id="pizza" name="pizza" required>
            <option value="" disabled selected>Elige una pizza</option>
            <option value="margarita">Pizza margarita - 10€</option>
            <option value="pepperoni">Pizza pepperoni - 12€</option>
            <option value="barbacoa">Pizza barbacoa - 12€</option>
            <option value="carnivora">Pizza carnívora - 13.50€</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label d-block fw-bold">Tipo de pago:</label>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" id="pago-bizum" name="pago" value="bizum">
            <label class="form-check-label" for="pago-bizum">BIZUM</label>
          </div>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" id="pago-tarjeta" name="pago" value="tarjeta">
            <label class="form-check-label" for="pago-tarjeta">Tarjeta</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Realizar pedido</button>
      </form>
    </div>
  </section>
</section>
