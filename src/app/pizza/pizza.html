<div class="container text-center">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4">
        @for (pizza of pizzasFiltradas; track pizza.name) {
        <div class="col mb-3">
            <app-lista-pizzas [name]="pizza.name" [price]="pizza.price" [ingredients]="pizza.ingredients"
                [imgSource]="pizza.imgSource">
            </app-lista-pizzas>
        </div>
        } @empty {
        <div class="col-12">
            <p>No hay pizzas con ese ingrediente.</p>
        </div>
        }
    </div>
</div>
